<!doctype html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="icons/favicon-128x128.png?v=<%= appVersion %>"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="icons/favicon-96x96.png?v=<%= appVersion %>"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="icons/favicon-32x32.png?v=<%= appVersion %>"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="icons/favicon-16x16.png?v=<%= appVersion %>"
    />
    <link rel="icon" type="image/ico" href="favicon.ico?v=<%= appVersion %>" />

    <style>
      .pwa-loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #1976d2 0%, #1565c0 100%);
        color: white;
        font-family: 'Roboto', sans-serif;
        z-index: 9999;
      }
      .pwa-loading-screen .app-name {
        font-size: 2rem;
        font-weight: bold;
        margin-bottom: 1rem;
      }
      .pwa-loading-screen .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="pwa-loading" class="pwa-loading-screen">
      <div class="app-name">Rifas Manager</div>
      <div class="spinner"></div>
    </div>
    <!-- quasar:entry-point -->
    <script>
      window.addEventListener('load', function() {
        var loader = document.getElementById('pwa-loading');
        if (loader) {
          loader.style.transition = 'opacity 0.3s';
          loader.style.opacity = '0';
          setTimeout(function() { loader.remove(); }, 300);
        }
      });
    </script>
  </body>
</html>
