services:
  rifas-api:
    container_name: rifas-api
    build:
      context: ../..
      dockerfile: docker/rifas/rifas-api/Dockerfile
      target: ${API_TARGET:-dev}
      args:
        USER_ID: ${MAP_UUID}
        GROUP_ID: ${MAP_UUID}
    user: "${MAP_UUID}:${MAP_UUID}"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      VIRTUAL_HOST: ${API_VIRTUAL_HOST}
      NPM_CONFIG_CACHE: /tmp/.npm
    init: true
    ports:
      - "8100:80"
    restart: unless-stopped
    networks:
      - docker-net

  rifas-app:
    container_name: rifas-app
    build:
      context: ../..
      dockerfile: docker/rifas/rifas-app/Dockerfile
      target: ${APP_TARGET:-dev}
      args:
        USER_ID: ${MAP_UUID}
        GROUP_ID: ${MAP_UUID}
    user: "${MAP_UUID}:${MAP_UUID}"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      VIRTUAL_HOST: ${APP_VIRTUAL_HOST}
      NPM_CONFIG_CACHE: /tmp/.npm
    init: true
    restart: unless-stopped
    networks:
      - docker-net
    depends_on:
      - rifas-api

  rifas-docs:
    container_name: rifas-docs
    build:
      context: ../..
      dockerfile: docker/rifas/rifas-docs/Dockerfile
    env_file:
      - .env
    environment:
      VIRTUAL_HOST: ${DOCS_VIRTUAL_HOST:-docs.rifas.local}
      DOCS_UID: ${MAP_UUID:-1000}
      DOCS_GID: ${MAP_UUID:-1000}
    volumes:
      - ../../docs/user:/var/www/html/user
      - ../../docs/themes:/var/www/html/user/themes
    restart: unless-stopped
    networks:
      - docker-net
    depends_on:
      - rifas-api

networks:
  docker-net:
    external: true
